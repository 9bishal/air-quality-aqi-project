name: Daily Air Quality & Weather Ingestion

on:
  schedule:
    # Run once daily at 01:00 UTC (06:30 IST)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ingest-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily incremental ingestion
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          python src/ingestion/fetch_historical_and_daily.py --mode daily

      - name: Run tests to verify pipeline integrity
        run: |
          export PYTHONPATH="."
          pytest -v

      - name: Commit and push updated datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/staging data/cleaned data/gold logs
          if git diff --staged --quiet; then
            echo "No new changes to commit"
          else
            git commit -m "Auto: daily data ingestion and pipeline refresh [skip ci]"
            git push
          fi
